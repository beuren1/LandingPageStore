<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta - Beuren Store</title>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./styles/main.scss">
</head>

<body>
    <main class="pagina-cadastro">
        <div class="cadastro-card">

            <h1>Criar conta</h1>
            <p>Cadastre-se na Beuren Store</p>

            <form id="form-cadastro">
                <label for="username">Nome de usuário</label>
                <input type="text" id="username" required minlength="3" autocomplete="username">

                <label for="email">E-mail</label>
                <input type="email" id="email" required autocomplete="email">

                <label for="password">Senha</label>
                <input type="password" id="password" required minlength="8" autocomplete="new-password">

                <label for="confirm-password">
                    Confirmar senha
                </label>
                <input type="password" id="confirm-password" required minlength="8" autocomplete="new-password">

                <p id="mensagem-cadastro" role="status" aria-live="polite"></p>

                <button type="submit" id="btn-cadastrar">
                    Criar conta
                </button>
            </form>

            <a href="./index.html">Voltar à loja</a>

        </div>
    </main>

    <script type="module" src="./scripts/cadastro.js"></script>
</body>

</html>
